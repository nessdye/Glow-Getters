<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glow Getter — Phone Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: start center;
      padding: 10px 18px 28px;
      background: #f7f4f6;
      color: #4d3044;
      font-family: Arial, sans-serif;
    }
    .phone {
      position: relative;
      width: 430px;
      height: 880px;
      max-width: calc(100vw - 24px);
      border: 7px solid #211820;
      border-radius: 58px;
      padding: 14px;
      background: #080708;
      box-shadow: 0 18px 48px rgba(77, 48, 68, .22), inset 0 0 0 2px #8d818b;
    }
    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 39px;
      background: #fffafb;
    }
    .statusbar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: #dc1768;
      color: white;
      font-size: 14px;
      font-weight: 700;
    }
    .status-icons { letter-spacing: 3px; }
    iframe {
      display: block;
      width: 390px;
      height: 800px;
      max-width: 100%;
      border: 0;
      background: #fffafb;
    }
    .speaker {
      position: absolute;
      z-index: 5;
      top: 17px;
      left: 50%;
      width: 118px;
      height: 25px;
      transform: translateX(-50%);
      border-radius: 18px;
      background: #080708;
      pointer-events: none;
    }
    @media (max-height: 910px) {
      .phone { transform: scale(.94); transform-origin: top center; }
      body { padding-top: 6px; }
    }
    @media (max-width: 470px) {
      body { padding: 0; background: #080708; }
      .phone { max-width: 100vw; border-radius: 0; border-width: 0; padding: 0; width: 390px; height: 844px; box-shadow: none; }
      .screen { border-radius: 0; }
      .speaker { display: none; }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Glow Getter mobile preview">
    <div class="speaker" aria-hidden="true"></div>
    <div class="screen">
      <div class="statusbar" aria-hidden="true">
        <span>7:03 AM</span>
        <span class="status-icons">▮◒ ▰</span>
      </div>
      <iframe src="./index.html#today" title="Glow Getter mobile app" onload="this.contentWindow.scrollTo(0,0)"></iframe>
    </div>
  </main>
</body>
</html>
